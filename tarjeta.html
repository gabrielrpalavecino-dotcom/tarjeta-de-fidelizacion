<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Mi tarjeta de sellos</title>
  <style>
    :root {
      --bg: #edf3f8;
      --panel: #ffffff;
      --ink: #142033;
      --muted: #5e6d82;
      --line: #d6dfeb;
      --sky: #6fb3e0;
      --sky-deep: #0d4a73;
      --gold: #d9a227;
      --shadow: rgba(16, 33, 55, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #eaf2fa, #edf5f7);
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    #app {
      width: min(100%, 520px);
    }

    .card {
      background: linear-gradient(180deg, #ffffff, #f7fafe);
      border-radius: 26px;
      border: 1px solid var(--line);
      box-shadow: 0 18px 30px -18px var(--shadow);
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, var(--sky), var(--sky-deep));
      color: #fff;
      padding: 18px 20px 16px;
    }

    .card-header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
      line-height: 1.1;
    }

    .card-body {
      padding: 18px 20px 20px;
    }

    .code {
      font-weight: 800;
      letter-spacing: 0.12em;
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: var(--ink);
      word-break: break-all;
    }

    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0 12px;
    }

    .stamp {
      aspect-ratio: 1;
      border-radius: 16px;
      border: 3px dashed var(--line);
      display: grid;
      place-items: center;
      color: var(--line);
      background: #f7f9fc;
      font-size: 1.5rem;
      font-weight: 800;
      transition: transform 0.18s ease;
    }

    .stamp.on {
      border-style: solid;
      border-color: var(--gold);
      background: rgba(217, 162, 39, 0.12);
      color: var(--gold);
      transform: scale(1.03);
    }

    .stamp.on.star { font-size: 1.7rem; }
    .stamp.on.square { font-size: 1.5rem; }

    .message {
      margin: 6px 0 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--sky-deep);
    }

    .message.done {
      color: var(--gold);
    }

    .small {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .error, .empty {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 18px 30px -18px var(--shadow);
      padding: 22px 20px;
      text-align: center;
      color: var(--ink);
    }

    .error strong {
      display: block;
      margin-bottom: 8px;
      color: #a62020;
    }

    .muted {
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 420px) {
      .stamp-grid {
        gap: 8px;
      }
      .card-body {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script src="config.js"></script>
  <script>
    (() => {
      const app = document.getElementById('app');

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getCardId() {
        const fromSearch = new URLSearchParams(window.location.search).get('id');
        if (fromSearch) return fromSearch.trim().toLowerCase();

        const fromHash = window.location.hash.replace(/^#/, '').trim();
        if (fromHash) return fromHash.toLowerCase();

        const stored = (localStorage.getItem('tid') || '').trim();
        return stored.toLowerCase();
      }

      function renderError(message) {
        app.innerHTML = `
          <div class="error">
            <strong>No se pudo cargar la tarjeta</strong>
            <div>${escapeHtml(message)}</div>
            <div class="muted" style="margin-top:10px;">Revisa config.js y la conexión con Supabase.</div>
          </div>
        `;
      }

      function renderEmpty() {
        app.innerHTML = `
          <div class="empty">
            <h2 style="margin:0 0 10px;">Tarjeta no disponible</h2>
            <div class="muted">Escanea el QR, usa la URL correcta o vuelve a abrir la tarjeta desde la app.</div>
          </div>
        `;
      }

      function getGoal(card) {
        const config = card?.config && typeof card.config === 'object' ? card.config : {};
        const explicitGoal = Number(config.goal || card?.goal || 0);
        if (explicitGoal > 0) return explicitGoal;
        const stamps = Array.isArray(card?.stamps) ? card.stamps.length : 0;
        return Math.max(10, stamps || 10);
      }

      function renderCard(card) {
        const config = card?.config && typeof card.config === 'object' ? card.config : {};
        const id = card?.id || 'SIN-ID';
        const stamps = Array.isArray(card?.stamps) ? card.stamps : [];
        const goal = getGoal(card);
        const title = config.title || 'Mi tarjeta de sellos';
        const reward = config.prize || config.prizeS || 'Premio';
        const isComplete = stamps.length >= goal;
        const cells = [];

        for (let i = 0; i < goal; i += 1) {
          const active = i < stamps.length;
          const value = active ? (stamps[i] === 'q' ? '■' : '★') : '';
          const kind = active ? (stamps[i] === 'q' ? 'square' : 'star') : '';
          cells.push(`<div class="stamp ${active ? 'on' : ''} ${kind}">${value}</div>`);
        }

        const message = isComplete ? '¡Tarjeta completada!' : `Faltan ${Math.max(0, goal - stamps.length)} sellos`;

        app.innerHTML = `
          <div class="card">
            <div class="card-header">
              <h1>${escapeHtml(title)}</h1>
            </div>
            <div class="card-body">
              <div class="code">${escapeHtml(id)}</div>
              <div class="stamp-grid">${cells.join('')}</div>
              <div class="message ${isComplete ? 'done' : ''}">${escapeHtml(message)}</div>
              <div class="small">
                <div><strong>Premio:</strong> ${escapeHtml(reward)}</div>
                <div style="margin-top:6px;">Sellos acumulados: ${stamps.length} / ${goal}</div>
              </div>
            </div>
          </div>
        `;
      }

      async function loadCard() {
        const cfg = window.CFG || {};
        const id = getCardId();

        if (!cfg.URL || !cfg.KEY) {
          renderError('La configuración de Supabase no está disponible. Revisa el archivo config.js.');
          return;
        }

        if (!id) {
          renderEmpty();
          return;
        }

        localStorage.setItem('tid', id);

        try {
          const response = await fetch(`${cfg.URL}/rest/v1/rpc/get_card`, {
            method: 'POST',
            headers: {
              apikey: cfg.KEY,
              Authorization: `Bearer ${cfg.KEY}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ p_id: id })
          });

          if (!response.ok) {
            const detail = await response.text();
            throw new Error(`Supabase respondió ${response.status}. ${detail || response.statusText}`);
          }

          const data = await response.json();
          const card = Array.isArray(data) ? data[0] : data;

          if (!card || !card.id) {
            throw new Error('La tarjeta no existe o no se pudo leer.');
          }

          renderCard(card);
        } catch (error) {
          renderError(error.message || 'No se pudo cargar la tarjeta.');
        }
      }

      loadCard();
    })();
  </script>
</body>
</html>
